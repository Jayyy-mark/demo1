{% extends "frontend/layouts/base.html" %}

{% block title %}Our Academic & Industry Partners - UCSTGO{% endblock %}

{% block content %}

<!-- Modern Partners Section -->
<section id="our-partners" class="scroll-animate py-16 bg-gradient-to-b from-slate-50 to-white">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">

        <!-- Header Section -->
        <div class="text-center mb-16">

            <h2 class="text-2xl md:text-4xl font-bold text-blue-800 mb-4">Corporated Universities</h2>
            <div class="w-24 h-1 bg-amber-400 mx-auto mb-6 rounded"></div>

        </div>

        <!-- 3-Column Grid Layout -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="partners-grid">



        </div>

        <!-- View More Button Container -->
        <div class="text-center mt-20">
            <button id="load-more-partners"
                class="inline-flex items-center gap-2 bg-blue-800 hover:bg-blue-900 text-white font-medium px-8 py-3.5 rounded-full transition-all duration-300 shadow-md hover:shadow-lg transform active:scale-95 focus:outline-none">
                <span>View All Partners</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>

    </div>
</section>

{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='frontend/js/pages/university.js') }}"></script>
{% endblock %}

{% block styles %}
<style>
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-slide-up {
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .line-clamp-3 {
        display: -webkit-box;
        line-clamp: 3;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
</style>
{% endblock %}
