{% extends "frontend/layouts/base.html" %}

{% block title %}Publications - UCSTGO{% endblock %}


{% block styles %}
<style>
/* ဖြည်းဖြည်းချင်းပေါ်လာစေမည့် Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fadeIn 0.5s ease forwards;
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.line-clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* smooth animation feel */
* {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* soft hover card lift */
.card-soft {
    transition: all 0.25s ease;
}

.card-soft:hover {
    transform: translateY(-4px);
}

/* subtle blur glass feel */
.glass {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
</style>
{% endblock %}

{% block content %}

<!-- Publications Section -->
<section id="publications" >
    <div class="max-w-7xl mx-auto px-6 py-12">

        <!-- Header Card (Soft Glass) -->
        <div class="bg-white/60 backdrop-blur-md border border-gray-100 shadow-sm rounded-2xl p-6 mb-8">

            <div class="text-center mb-6">
                <h2 class="text-3xl font-semibold text-blue-800">Publications</h2>
                <div class="h-1.5 w-20 bg-amber-400 mx-auto mt-6 rounded-full"></div>
            </div>

            <!-- Search -->
            <div class="flex justify-center">
                <input
                    id="pub-search"
                    type="text"
                    placeholder="Search publications..."
                    class="w-full md:w-1/2 px-5 py-3 rounded-xl bg-gray-50 border border-gray-200
                        focus:outline-none focus:ring-2 focus:ring-blue-200 transition"
                />
            </div>

            <!-- Year Filter -->
            <div id="pub-year-filters" class="flex flex-wrap justify-center gap-2 mt-5">
                <button class="year-filter-btn active px-5 py-2 rounded-full text-sm font-medium
                            bg-gray-900 text-white shadow-sm"
                        data-year="all">
                    All
                </button>
            </div>

        </div>

        <!-- Publications Container -->
        <div id="pub-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">

        </div>

        <!-- Pagination -->
        <div class="mt-12 flex justify-center items-center gap-2" id="pagination"></div>
    </div>
</section>



{% endblock %}

{% block scripts %}
<script>
// အရင်ရှိပြီးသား toggle function (မပြောင်းလဲပါ)
function togglePub(id, btn) {
    const el = document.getElementById(id);
    if (el.classList.contains('max-h-10')) {
        el.classList.remove('max-h-10');
        el.classList.add('max-h-96');
        btn.innerText = 'SHOW LESS';
    } else {
        el.classList.remove('max-h-96');
        el.classList.add('max-h-10');
        btn.innerText = 'READ MORE';
    }
}
</script>
<script type="module" src="{{ url_for('static', filename='frontend/js/pages/publication.js') }}"></script>
{% endblock %}
