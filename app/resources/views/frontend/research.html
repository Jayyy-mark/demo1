{% extends "frontend/layouts/base.html" %}

{% block title %}Research & Publications - UCSTGO{% endblock %}

{% block content %}

<!-- Research Labs Section -->
    <section id="labs" class=" pb-16 py-12">
        <div class="max-w-7xl mx-auto px-6">
            <div class="mb-12">
                <h2 class="text-3xl md:text-4xl font-black text-center text-blue-800 mb-4">Research Labs</h2>
                <div class="w-24 h-1 bg-amber-400 mx-auto mb-6 rounded"></div>

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="lab-card-container">

            </div>
        </div>
    </section>

{% block styles %}
<style>
/* ဖြည်းဖြည်းချင်းပေါ်လာစေမည့် Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fadeIn 0.5s ease forwards;
}
</style>
{% endblock %}

{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='frontend/js/pages/research.js') }}"></script>
{% endblock %}
