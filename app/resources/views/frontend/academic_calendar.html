{% extends "frontend/layouts/base.html" %}

{% block title %}Academic Calendar - UCSTGO{% endblock %}

{% block styles %}
<style>
    .calendar-shell {
        border: 1px solid #e6eaf0;
        border-radius: 12px;
        background: #fff;
    }

    .calendar-toolbar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 24px;
        border-bottom: 1px solid #e6eaf0;
    }

    .calendar-nav {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .calendar-nav .btn-icon {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #dfe5ef;
        background: #fff;
        border-radius: 8px;
    }

    .calendar-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        color: #101828;
    }

    .calendar-view-switch {
        display: inline-flex;
        padding: 4px;
        gap: 4px;
        background: #f2f4f7;
        border-radius: 8px;
    }

    .calendar-view-switch button {
        min-width: 74px;
        padding: 8px 12px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #667085;
        font-weight: 600;
    }

    .calendar-view-switch button.active {
        background: #fff;
        color: #101828;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    }

    .calendar-weekdays,
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(120px, 1fr));
    }

    .calendar-grid {
        grid-template-rows: repeat(6, minmax(150px, auto));
        position: relative;
    }

    .calendar-weekday {
        padding: 16px 20px;
        color: #98a2b3;
        font-weight: 700;
        font-size: 13px;
        border-bottom: 1px solid #e6eaf0;
        background: #fafbfc;
    }

    .calendar-day {
        min-height: 150px;
        padding: 16px 12px;
        border-right: 1px solid #e6eaf0;
        border-bottom: 1px solid #e6eaf0;
        background: #fff;
        position: relative;
    }

    .calendar-day:nth-child(7n) {
        border-right: 0;
    }

    .calendar-day.is-muted {
        background: #fbfcfe;
    }

    .calendar-day.is-today {
        background: #f1f4f9;
    }

    .calendar-day-number {
        display: block;
        margin-bottom: 12px;
        color: #101828;
        font-weight: 600;
    }

    .calendar-day.is-muted .calendar-day-number {
        color: #98a2b3;
    }

    .calendar-event {
        width: auto;
        min-width: 0;
        margin: calc(48px + (var(--event-slot, 0) * 42px)) 6px 0;
        padding: 10px 12px;
        border: 1px solid  #d1d5db;
        border-radius: 8px;
        text-align: left;
        color: #101828;
        font-size: 13px;
        line-height: 1.25;
        display: flex;
        gap: 10px;
        align-items: center;
        align-self: start;
        position: relative;
        z-index: 2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .calendar-event::before {
        content: "";
        width: 4px;
        min-width: 4px;
        height: 20px;
        border-radius: 999px;
        background: currentColor;
    }

    .calendar-event.status-pending {
        background: #fff1f0;
        color: #c2410c;
    }

    .calendar-event.status-on-progress {
        background: #edf3ff;
        color: #3158ff;
    }

    .calendar-event.status-completed {
        background: #eafaf1;
        color: #12b76a;
    }

    .calendar-empty {
        padding: 48px 16px;
        text-align: center;
        color: #667085;
    }

    @media (max-width: 991.98px) {
        .calendar-toolbar {
            grid-template-columns: 1fr;
        }

        .calendar-title {
            text-align: left;
        }

        .calendar-weekdays,
        .calendar-grid {
            grid-template-columns: repeat(7, minmax(96px, 1fr));
            overflow-x: auto;
        }

        .calendar-shell {
            overflow-x: auto;
        }
    }

/* Split Layout Grid Config */
    .calendar-layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 32px;
        align-items: start;
    }

    /* Upcoming Events Sidebar Component */
    .upcoming-panel {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .upcoming-main-title {
        font-size: 28px;
        font-weight: 700;
        color: #1e40af;
        margin: 0 0 4px 0;
    }

    .upcoming-subtitle {
        font-size: 14px;
        color: #667085;
        margin: 0;
    }

    .upcoming-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* List Card Component UI */
    .upcoming-card {
        background: #fff;
        border: 1px solid #e6eaf0;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05);
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .upcoming-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
    }

    .upcoming-card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
    }

    .upcoming-card .status-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
    }

    /* Dynamic Status Styles mapping to Card Meta Elements */
    .upcoming-card.status-pending .status-indicator { background-color: #c2410c; }
    .upcoming-card.status-pending .upcoming-date { color: #c2410c; }
    
    .upcoming-card.status-on-progress .status-indicator { background-color: #3158ff; }
    .upcoming-card.status-on-progress .upcoming-date { color: #3158ff; }

    .upcoming-card.status-completed .status-indicator { background-color: #12b76a; }
    .upcoming-card.status-completed .upcoming-date { color: #12b76a; }

    .upcoming-title {
        font-size: 16px;
        font-weight: 700;
        color: #101828;
        margin: 0;
    }

    .upcoming-desc {
        font-size: 13px;
        color: #667085;
        margin: 0;
        line-height: 1.4;
    }

    /* Fluid Responsive Layout break for Mobile/Tablets */
    @media (max-width: 991.98px) {
        .calendar-layout {
            grid-template-columns: 1fr;
            gap: 40px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="calendar-layout">
        
        <div class="upcoming-panel">
            <div class="upcoming-header">
                <h2 class="upcoming-main-title">Academic Calendar</h2>
                <p class="upcoming-subtitle">Upcoming Events</p>
            </div>
            <div id="upcoming-events-list" class="upcoming-list">
                </div>
        </div>

        <div class="calendar-shell">
            <div class="calendar-toolbar">
                <div class="calendar-nav">
                    <button type="button" class="btn-icon" id="calendar-prev" aria-label="Previous month">
                        <i class="ti ti-chevron-left"></i>
                    </button>
                    <button type="button" class="btn-icon" id="calendar-next" aria-label="Next month">
                        <i class="ti ti-chevron-right"></i>
                    </button>
                </div>

                <h5 class="calendar-title" id="calendar-title">Calendar</h5>

            </div>

            <div class="calendar-weekdays">
                <div class="calendar-weekday">SUN</div>
                <div class="calendar-weekday">MON</div>
                <div class="calendar-weekday">TUE</div>
                <div class="calendar-weekday">WED</div>
                <div class="calendar-weekday">THU</div>
                <div class="calendar-weekday">FRI</div>
                <div class="calendar-weekday">SAT</div>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}

<script type="module" src="{{ url_for("static", filename="frontend/js/pages/calendar.js") }}"></script>

{% endblock %}
