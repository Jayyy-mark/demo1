{% extends "frontend/layouts/base.html" %}

{% block title %}Publications - UCSTGO{% endblock %}

{% block content %}

<!-- Publications Section -->
<section id="publications" class="py-20 pt-32">
    <div class="max-w-7xl mx-auto px-6">
       <!-- Changed justify-between to justify-center to keep the whole block centered -->
        <div class="flex flex-col md:flex-row md:items-end justify-center mb-12 gap-4">
            <!-- Added text-center and mx-auto -->
            <div class="text-center mx-auto">
                <h2 class="text-3xl md:text-4xl font-black text-blue-800 mb-2">Publications</h2>
                <div class="w-24 h-1 bg-amber-400 mx-auto mb-6 rounded"></div>
            </div>
        </div>

        <!-- Publications Container -->
        <div id="pub-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">

        </div>

        <!-- View More Button Area -->
        <div class="mt-12 text-center">
            <button id="view-more-btn" class="px-8 py-3 bg-slate-900 text-white rounded-full font-bold shadow-lg hover:bg-blue-600 transition-all">
                VIEW MORE
            </button>
        </div>
    </div>
</section>

{% block styles %}
<style>
/* ဖြည်းဖြည်းချင်းပေါ်လာစေမည့် Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fadeIn 0.5s ease forwards;
}
</style>
{% endblock %}

{% endblock %}

{% block scripts %}
<script>
// အရင်ရှိပြီးသား toggle function (မပြောင်းလဲပါ)
function togglePub(id, btn) {
    const el = document.getElementById(id);
    if (el.classList.contains('max-h-10')) {
        el.classList.remove('max-h-10');
        el.classList.add('max-h-96');
        btn.innerText = 'SHOW LESS';
    } else {
        el.classList.remove('max-h-96');
        el.classList.add('max-h-10');
        btn.innerText = 'READ MORE';
    }
}
</script>
<script type="module" src="{{ url_for('static', filename='frontend/js/pages/publication.js') }}"></script>
{% endblock %}
