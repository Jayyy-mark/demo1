{% extends "frontend/layouts/base.html" %}

{% block title %} Activity Gallery{% endblock %}

{% block content %}

<!-- Header -->
<section class="bg-white py-12 pb-12 border-b border-gray-100">

    <input type="hidden" name="" id="activity_id" value="{{ activity_id }}">

    <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <a href="" id="btn_backToActivities" class="inline-flex items-center text-sm text-gray-500 hover:text-apple-blue mb-6 transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Activities
        </a>
        <h1 class="text-2xl md:text-4xl text-center font-bold text-apple-dark mb-4" id="activity_name"></h1>
        <div class="flex items-center gap-4 text-gray-500 text-sm">
            <span class="flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg><span id="activity_date"></span></span>
            <span class="flex items-center" id="activity_category">Campus Grounds</span>
        </div>
    </div>
</section>

<!-- Description & Gallery -->
<section class="py-5 bg-apple-gray">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">

        <!-- Description -->
        <div class="max-w-3xl mx-auto mb-20 text-center">
            <p class="text-xl text-gray-600 leading-relaxed" id="description"></p>
        </div>

        <!-- Image Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="image-container">

        </div>

    </div>
</section>

<!-- Prev / Next Navigation -->
<section class="py-10 border-t border-slate-200 bg-gradient-to-b from-white to-slate-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Divider label -->
        <div class="flex items-center gap-4 mb-6">
            <div class="flex-1 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-[0.2em] shrink-0">Browse Activities</span>
            <div class="flex-1 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>
        </div>

        <div class="flex flex-row justify-between items-stretch gap-3 w-full">

            <!-- Previous Button -->
            <a id="btn_prevActivity" href="#"
               class="group flex items-center gap-3 sm:gap-5 p-4 sm:p-5 rounded-2xl bg-white border border-slate-200 hover:border-blue-400 hover:shadow-lg hover:shadow-blue-500/10 transition-all duration-300 max-w-[48%] w-full hidden">
                <div class="flex items-center justify-center w-11 h-11 sm:w-14 sm:h-14 rounded-xl bg-blue-50 border border-blue-100 group-hover:bg-blue-500 group-hover:border-blue-500 transition-all duration-300 shrink-0">
                    <i class="fa-solid fa-arrow-left text-base sm:text-lg text-blue-500 group-hover:text-white transition-all duration-300 group-hover:-translate-x-0.5"></i>
                </div>
                <div class="min-w-0">
                    <span class="text-[10px] sm:text-xs font-extrabold text-blue-400 uppercase tracking-[0.18em] block mb-1">← Previous</span>
                    <h5 id="prev_activity_name" class="text-sm sm:text-base font-bold text-slate-800 group-hover:text-blue-600 transition-colors line-clamp-2 leading-snug">Loading...</h5>
                </div>
            </a>

            <!-- Spacer when only one side is visible -->
            <div id="nav_spacer" class="flex-1 hidden"></div>

            <!-- Next Button -->
            <a id="btn_nextActivity" href="#"
               class="group flex items-center justify-end gap-3 sm:gap-5 p-4 sm:p-5 rounded-2xl bg-white border border-slate-200 hover:border-blue-400 hover:shadow-lg hover:shadow-blue-500/10 transition-all duration-300 max-w-[48%] w-full text-right hidden">
                <div class="min-w-0">
                    <span class="text-[10px] sm:text-xs font-extrabold text-blue-400 uppercase tracking-[0.18em] block mb-1">Next →</span>
                    <h5 id="next_activity_name" class="text-sm sm:text-base font-bold text-slate-800 group-hover:text-blue-600 transition-colors line-clamp-2 leading-snug">Loading...</h5>
                </div>
                <div class="flex items-center justify-center w-11 h-11 sm:w-14 sm:h-14 rounded-xl bg-blue-50 border border-blue-100 group-hover:bg-blue-500 group-hover:border-blue-500 transition-all duration-300 shrink-0">
                    <i class="fa-solid fa-arrow-right text-base sm:text-lg text-blue-500 group-hover:text-white transition-all duration-300 group-hover:translate-x-0.5"></i>
                </div>
            </a>

        </div>
    </div>
</section>




{% endblock %}

{% block scripts %}
<script>
    const activity_name = "{{ activity_name }}";
    console.log("this is activity name : ", activity_name);

</script>

<script type="module" src="{{ url_for('static', filename='frontend/js/pages/activity_gallery.js') }}"></script>
{% endblock %}
