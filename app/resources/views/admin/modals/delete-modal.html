<!-- Delete Confirmation Modal -->
<div class="modal fade confirm-modal" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg">

            <!-- Header -->
            <div class="modal-header border-0 justify-content-center">
                <div class="warning-icon">
                    <i class="ti ti-alert-triangle fs-1"></i>
                </div>
            </div>

            <!-- Body -->
            <div class="modal-body text-center px-4">
                <h5 class="modal-title mb-2">Perform delete?</h5>
                <p class="mb-0">
                    This action cannot be undone.<br>
                    Are you sure you want to proceed?
                </p>
            </div>

            <!-- Footer -->
            <div class="modal-footer border-0 justify-content-center gap-2 pb-4">
                <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button" class="btn btn-danger px-4" id="btn_delete" data-bs-dismiss="modal">
                    <i class="ti ti-trash"></i> Confirm
                </button>
            </div>
        </div>
    </div>
</div>
