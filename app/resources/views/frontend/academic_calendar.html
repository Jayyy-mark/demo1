{% extends "frontend/layouts/base.html" %}

{% block title %}Academic Calendar - UCSTGO{% endblock %}

{% block styles %}
<style>
    /* 🧩 GRID SYSTEM & BORDERS (Immune to Tailwind Purging) */
    .calendar-board-wrapper {
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        overflow: hidden;
        background-color: #ffffff;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .calendar-grid-engine {
        display: grid !important;
        grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
        background-color: #e2e8f0 !important; /* This creates clean 1px crisp lines */
        gap: 1px !important;
    }

    .calendar-day-cell {
        background-color: #ffffff;
        min-height: 120px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: background-color 0.15s ease;
    }

    .calendar-day-cell:hover {
        background-color: #f8fafc;
    }

    /* Shading for days belonging to previous/next month */
    .cell-out-of-month {
        background-color: #f8fafc;
        background-image: linear-gradient(135deg, #f1f5f9 25%, transparent 25%, transparent 50%, #f1f5f9 50%, #f1f5f9 75%, transparent 75%, transparent);
        background-size: 14px 14px;
        opacity: 0.6;
    }

    /* 🏷️ MYANMAR EVENT PILLS AND BADGES */
    .event-pill-stack {
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .myanmar-event-badge {
        font-family: 'Noto Sans Myanmar', 'Outfit', sans-serif;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 8px;
        border-radius: 6px;
        line-height: 1.5; /* Balanced spacing for Burmese characters */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-left: 3px solid transparent;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
    }

    /* Badge Color Definitions */
    .badge-primary { background-color: #e0e7ff; color: #3730a3; border-left-color: #4f46e5; }
    .badge-success { background-color: #d1fae5; color: #065f46; border-left-color: #10b981; }
    .badge-danger  { background-color: #fee2e2; color: #991b1b; border-left-color: #ef4444; }
    .badge-warning { background-color: #fef3c7; color: #92400e; border-left-color: #f59e0b; }
    .badge-secondary { background-color: #f1f5f9; color: #334155; border-left-color: #64748b; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- 🗓️ CALENDAR CONTROL ACTIONS BAR -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 p-6 bg-white rounded-2xl border border-slate-100 shadow-sm transition-all duration-300 gap-5">

    <!-- 🗓️ Left Side: Clean Typography & Icon -->
    <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50/60 border border-indigo-100/50 flex items-center justify-center text-indigo-600 shadow-sm shadow-indigo-100/30">
            <i class="fa-regular fa-calendar-check text-xl"></i>
        </div>
        <div>
            <h1 id="monthTitle" class="text-xl md:text-2xl font-bold text-slate-800 tracking-tight leading-none">June 2026</h1>
            <p class="text-slate-400 text-[11px] font-semibold tracking-wider uppercase mt-1.5 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Academic Schedule
            </p>
        </div>
    </div>

    <!-- ⚙️ Right Side: Interactive Navigation Controls -->
    <div class="flex flex-wrap items-center gap-3">

        <!-- Custom Year Selector Dropdown -->
        <div class="relative min-w-[110px]">
            <select id="yearSelector" onchange="handleYearChange(this.value)" class="w-full appearance-none bg-slate-50 border border-slate-200 text-slate-700 font-bold px-4 pr-9 h-10 rounded-xl text-xs hover:bg-slate-100 hover:border-slate-300 transition-all duration-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 cursor-pointer">
                <!-- Populated by JS -->
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-3.5 flex items-center text-slate-400">
                <i class="fa-solid fa-angle-down text-[10px]"></i>
            </div>
        </div>

        <!-- Segmented Navigation Controller -->
        <div class="flex items-center bg-slate-50 border border-slate-200/80 p-1 rounded-xl shadow-inner">
            <button onclick="prevMonth()" class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:bg-white rounded-lg transition duration-200 hover:shadow-sm" title="Previous Month">
                <i class="fa fa-chevron-left text-[10px]"></i>
            </button>
            <button onclick="goToday()" class="px-4 h-8 font-bold text-slate-700 text-xs hover:text-indigo-600 hover:bg-white rounded-lg transition duration-200 hover:shadow-sm">
                Today
            </button>
            <button onclick="nextMonth()" class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:bg-white rounded-lg transition duration-200 hover:shadow-sm" title="Next Month">
                <i class="fa fa-chevron-right text-[10px]"></i>
            </button>
        </div>

        <!-- View Mode Filter Dropdown -->
        <div class="relative">
            <button class="bg-white border border-slate-200 text-slate-600 font-semibold px-4 h-10 rounded-xl text-xs flex items-center gap-2 hover:bg-slate-50 hover:border-slate-300 transition duration-200 shadow-sm">
                <i class="fa-solid fa-sliders text-slate-400 text-[10px]"></i>
                <span>Month view</span>
                <i class="fa fa-chevron-down text-[9px] text-slate-400 ml-1"></i>
            </button>
        </div>

    </div>
</div>

    <!-- 📊 CALENDAR BASE BOARD WITH PERMANENT GRID LINES -->
    <div class="calendar-board-wrapper">

        <!-- WEEKDAYS ROW -->
        <div class="calendar-grid-engine text-center bg-slate-50 border-b border-slate-200 font-bold text-[11px] uppercase tracking-widest text-slate-400/90 py-3.5">
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div class="text-indigo-600/80">Sat</div>
            <div class="text-rose-600/80">Sun</div>
        </div>

        <!-- MAIN RESPONSIVE DAY GENERATION DECK -->
        <div id="calendar" class="calendar-grid-engine">
            <!-- Dynamic Cells populated safely via script -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* ---------------------------------
   EVENTS CORE CONFIGURATION
---------------------------------- */
const events = [
    { date: "2026-06-01", title: "ကျောင်းအပ်စတင်လက်ခံခြင်း", type: "primary" },
    { date: "2026-06-01", title: "Syllabus Review Meeting", type: "secondary" },
    { date: "2026-06-02", title: "ကျောင်းအပ်လက်ခံခြင်း", type: "primary" },
    { date: "2026-06-03", title: "ကျောင်းအပ်လက်ခံခြင်း", type: "primary" },
    { date: "2026-06-12", title: "ကျောင်းအပ်နှံမှုနောက်ဆုံးရက်", type: "danger" },
    { date: "2026-06-15", title: "ပထမနှစ်ဝက် အတန်းများစတင်ခြင်း", type: "success" },
    { date: "2026-06-26", title: "Freshers' Welcome ပွဲညှိနှိုင်းမှု", type: "warning" }
];

/* ---------------------------------
   SYSTEM STATE MACHINE
---------------------------------- */
let currentDate = new Date(2026, 5, 1);

function getMondayIndex(jsDay) {
    return (jsDay + 6) % 7;
}

/* ---------------------------------
   INITIALIZE & RUN COMPONENT SELECTORS
---------------------------------- */
function initYearSelector() {
    const yearSelector = document.getElementById("yearSelector");
    const startYear = 2020;
    const endYear = 2035;

    yearSelector.innerHTML = "";
    for (let yr = startYear; yr <= endYear; yr++) {
        const option = document.createElement("option");
        option.value = yr;
        option.innerText = `Year: ${yr}`;
        yearSelector.appendChild(option);
    }
}

function handleYearChange(selectedYear) {
    currentDate.setFullYear(parseInt(selectedYear));
    renderCalendar();
}

/* ---------------------------------
   PURGE-SAFE CALENDAR VISIBILITY RENDERER
---------------------------------- */
function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
    ];

    document.getElementById("monthTitle").innerText = `${monthNames[month]} ${year}`;

    const yearSelector = document.getElementById("yearSelector");
    if (yearSelector) {
        yearSelector.value = year;
    }

    const grid = document.getElementById("calendar");
    grid.innerHTML = "";

    const firstDay = getMondayIndex(new Date(year, month, 1).getDay());
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    /* 1. Empty Pad Prefixes (Previous Month Balance Days) */
    for (let i = firstDay - 1; i >= 0; i--) {
        grid.innerHTML += `<div class="calendar-day-cell cell-out-of-month select-none"></div>`;
    }

    /* 2. Active Month Generation */
    const today = new Date();

    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const dayEvents = events.filter(e => e.date === dateStr);

        const isToday =
            today.getDate() === day &&
            today.getMonth() === month &&
            today.getFullYear() === year;

        let cell = `
        <div class="calendar-day-cell">
            <div class="flex justify-between items-start">
        `;

        if (isToday) {
            cell += `
                <div class="w-6 h-6 flex items-center justify-center rounded-lg bg-indigo-600 text-white text-[11px] font-bold shadow-sm">
                    ${day}
                </div>
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-600 mt-1 mr-0.5 animate-pulse"></span>
            `;
        } else {
            const dayOfWeek = new Date(year, month, day).getDay();
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
            const numColor = isWeekend ? "text-rose-500 font-bold" : "text-slate-400 font-semibold";

            cell += `
                <div class="text-[11px] md:text-xs ${numColor}">
                    ${day}
                </div>
            `;
        }

        cell += `</div>`;

        /* EVENT CARD PILLS (Mapped to static, unpurgeable styles) */
        if (dayEvents.length > 0) {
            cell += `<div class="event-pill-stack">`;

            dayEvents.forEach(ev => {
                let colorClass = "badge-primary";
                if (ev.type === "success") colorClass = "badge-success";
                if (ev.type === "danger") colorClass = "badge-danger";
                if (ev.type === "warning") colorClass = "badge-warning";
                if (ev.type === "secondary") colorClass = "badge-secondary";

                cell += `
                    <div class="myanmar-event-badge ${colorClass}" title="${ev.title}">
                        ${ev.title}
                    </div>
                `;
            });

            cell += `</div>`;
        } else {
            cell += `<div class="flex-1"></div>`;
        }

        cell += `</div>`;
        grid.innerHTML += cell;
    }

    /* 3. Empty Pad Suffixes (Next Month Balance Days) */
    const totalCells = firstDay + daysInMonth;
    const nextMonthEmptyCells = (7 - (totalCells % 7)) % 7;
    for (let k = 0; k < nextMonthEmptyCells; k++) {
        grid.innerHTML += `<div class="calendar-day-cell cell-out-of-month select-none"></div>`;
    }
}

/* ---------------------------------
   NAVIGATION LOGIC LINKS
---------------------------------- */
function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
}

function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
}

function goToday() {
    currentDate = new Date();
    renderCalendar();
}

/* INITIALIZE WORKSPACE SYSTEM */
initYearSelector();
renderCalendar();
</script>
{% endblock %}
