<!-- Chatbot Toggle Button -->
<button id="chatbot-toggle-btn" class="fixed bottom-6 right-6 z-[9999] bg-royal text-white w-14 h-14 rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.2)] hover:shadow-[0_8px_30px_rgb(37,99,235,0.4)] hover:-translate-y-1 transition-all duration-300 flex items-center justify-center focus:outline-none cursor-move select-none">
    <i class="fa-solid fa-message text-2xl pointer-events-none"></i>
</button>

<!-- Chatbot UI Panel -->
<div id="chatbot-panel" class="fixed bottom-24 right-6 z-[9999] w-[350px] md:w-[450px] bg-white rounded-3xl shadow-2xl flex flex-col hidden overflow-hidden border border-gray-100 transition-all duration-300 transform scale-95 opacity-0 font-sans">
    
    <!-- Modern Header -->
    <div class="bg-gradient-to-r from-royal to-blue-600 p-5 flex justify-between items-center text-white">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm shadow-inner">
                <i class="fa-solid fa-robot text-white text-lg"></i>
            </div>
            <div>
                <h3 class="font-bold text-lg leading-tight tracking-wide">UCSTGO Assistant</h3>
                <div class="flex items-center gap-1.5 mt-1">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    <p class="text-xs text-blue-100 font-medium">Online</p>
                </div>
            </div>
        </div>
        <button id="chatbot-close-btn" class="text-white/80 hover:text-white hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center transition-all focus:outline-none">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
    </div>

    <!-- Quick Shot Questions (Moved UP) -->
    <div id="chatbot-quick-questions" class="px-4 py-3 bg-gray-50/80 flex gap-2 overflow-x-auto whitespace-nowrap hide-scrollbar border-b border-gray-100">
        <button class="quick-question-btn text-xs font-medium bg-white border border-gray-200 text-gray-700 rounded-full px-4 py-2 hover:border-royal hover:text-royal transition-all shadow-sm">Admission Requirements</button>
        <button class="quick-question-btn text-xs font-medium bg-white border border-gray-200 text-gray-700 rounded-full px-4 py-2 hover:border-royal hover:text-royal transition-all shadow-sm">Available Courses</button>
        <button class="quick-question-btn text-xs font-medium bg-white border border-gray-200 text-gray-700 rounded-full px-4 py-2 hover:border-royal hover:text-royal transition-all shadow-sm">Contact Info</button>
    </div>

    <!-- Chat Messages Area -->
    <div id="chatbot-messages" class="flex-grow p-5 overflow-y-auto bg-gray-50 flex flex-col gap-4 h-[350px] scroll-smooth relative">
        <!-- Default Welcome Message -->
        <div class="flex items-end gap-2.5">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-royal to-blue-500 flex-shrink-0 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-robot text-xs"></i>
            </div>
            <div class="bg-white border border-gray-100 rounded-2xl rounded-bl-none px-4 py-3 text-[14px] text-gray-700 shadow-sm leading-relaxed max-w-[85%]">
                Hello! I am the UCSTGO Assistant. How can I help you today?
            </div>
        </div>
    </div>

    <!-- Skip Button (Floating above input) -->
    <div class="relative">
        <div id="chatbot-skip-btn-container" class="absolute bottom-2 right-4 hidden z-10">
            <button id="chatbot-skip-btn" class="text-xs font-medium bg-gray-800 text-white px-4 py-1.5 rounded-full hover:bg-gray-700 transition-colors shadow-lg flex items-center gap-1.5 focus:outline-none">
                <i class="fa-solid fa-forward-step text-[10px]"></i> Skip Typing
            </button>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 bg-white border-t border-gray-100 flex items-center gap-3">
        <div class="relative flex-grow">
            <input type="text" id="chatbot-input" class="w-full bg-gray-100 border border-transparent rounded-full pl-5 pr-4 py-3 text-sm focus:outline-none focus:bg-white focus:border-royal focus:ring-4 focus:ring-royal/10 transition-all placeholder-gray-400 shadow-inner" placeholder="Ask me anything...">
        </div>
        <button id="chatbot-send-btn" class="w-12 h-12 rounded-full bg-royal text-white flex items-center justify-center flex-shrink-0 hover:bg-blue-600 transition-colors shadow-md hover:shadow-lg focus:outline-none">
            <i class="fa-solid fa-paper-plane ml-[-2px]"></i>
        </button>
    </div>
</div>

<style>
    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .ai-message-content {
        line-height: 1.6;
    }
    .ai-message-content p {
        margin-bottom: 0.5rem;
    }
    .ai-message-content p:last-child {
        margin-bottom: 0;
    }
    .ai-message-content ul, .ai-message-content ol {
        margin-left: 1.25rem;
        margin-bottom: 0.5rem;
    }
    .ai-message-content li {
        list-style-type: disc;
        margin-bottom: 0.25rem;
    }
    .ai-message-content a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }
    .ai-message-content a:hover {
        text-decoration: underline;
    }
    .ai-message-content strong {
        font-weight: 600;
        color: #1f2937;
    }
    
    /* Optional: Custom scrollbar for messages */
    #chatbot-messages::-webkit-scrollbar {
        width: 6px;
    }
    #chatbot-messages::-webkit-scrollbar-track {
        background: transparent;
    }
    #chatbot-messages::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 10px;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("chatbot-toggle-btn");
        const closeBtn = document.getElementById("chatbot-close-btn");
        const panel = document.getElementById("chatbot-panel");
        const messagesContainer = document.getElementById("chatbot-messages");
        const inputField = document.getElementById("chatbot-input");
        const sendBtn = document.getElementById("chatbot-send-btn");
        const quickQuestions = document.querySelectorAll(".quick-question-btn");
        const skipBtnContainer = document.getElementById("chatbot-skip-btn-container");
        const skipBtn = document.getElementById("chatbot-skip-btn");

        let isPanelOpen = false;
        let isTyping = false;
        let currentTypingInterval = null;
        let currentFullMessage = "";
        let currentMessageElement = null;

        // Ensure marked.js is available for formatting markdown from bot
        if (typeof marked === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
            document.head.appendChild(script);
        }

        // --- Draggable Icon Logic ---
        let isDragging = false;
        let startX, startY, initialX, initialY;
        let dragged = false;

        toggleBtn.addEventListener('mousedown', dragStart);
        toggleBtn.addEventListener('touchstart', dragStart, {passive: true});

        function dragStart(e) {
            if (e.type === "touchstart") {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                if(e.button !== 0) return; // only left click
                startX = e.clientX;
                startY = e.clientY;
                e.preventDefault(); 
            }
            
            const rect = toggleBtn.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            
            isDragging = true;
            dragged = false;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);
        }

        function drag(e) {
            if (!isDragging) return;
            
            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
            
            let dx = clientX - startX;
            let dy = clientY - startY;
            
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                dragged = true;
                toggleBtn.style.transition = 'none';
            }

            if (dragged) {
                if (e.type === "touchmove") e.preventDefault(); 
                
                let newX = initialX + dx;
                let newY = initialY + dy;
                
                const btnWidth = toggleBtn.offsetWidth;
                const btnHeight = toggleBtn.offsetHeight;
                
                // Edge handling
                newX = Math.max(0, Math.min(newX, window.innerWidth - btnWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - btnHeight));
                
                toggleBtn.style.right = 'auto';
                toggleBtn.style.bottom = 'auto';
                toggleBtn.style.left = newX + 'px';
                toggleBtn.style.top = newY + 'px';
                
                if (isPanelOpen) {
                    positionPanel();
                }
            }
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            toggleBtn.style.transition = 'all 0.3s ease';
            
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchend', dragEnd);
        }

        function positionPanel() {
            const btnRect = toggleBtn.getBoundingClientRect();
            
            panel.style.bottom = 'auto';
            panel.style.right = 'auto';
            panel.style.top = 'auto';
            panel.style.left = 'auto';
            
            panel.style.display = 'flex';
            let panelW = panel.offsetWidth || (window.innerWidth >= 768 ? 400 : 350); 
            const panelH = panel.offsetHeight || 500; 
            panel.style.display = '';

            const margin = 16;
            let pLeft, pTop;
            
            if (btnRect.left + btnRect.width / 2 > window.innerWidth / 2) {
                pLeft = btnRect.right - panelW;
            } else {
                pLeft = btnRect.left;
            }
            
            if (btnRect.top + btnRect.height / 2 > window.innerHeight / 2) {
                pTop = btnRect.top - panelH - margin;
            } else {
                pTop = btnRect.bottom + margin;
            }
            
            pLeft = Math.max(margin, Math.min(pLeft, window.innerWidth - panelW - margin));
            pTop = Math.max(margin, Math.min(pTop, window.innerHeight - panelH - margin));
            
            panel.style.left = pLeft + 'px';
            panel.style.top = pTop + 'px';
            
            let originY = btnRect.top > window.innerHeight / 2 ? 'bottom' : 'top';
            let originX = btnRect.left > window.innerWidth / 2 ? 'right' : 'left';
            panel.style.transformOrigin = `${originX} ${originY}`;
        }
        // -----------------------------

        function scrollToBottom() {
            messagesContainer.scrollTo({
                top: messagesContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function toggleChat() {
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                positionPanel();
                panel.classList.remove("hidden");
                // Allow transition
                setTimeout(() => {
                    panel.classList.remove("scale-95", "opacity-0");
                    panel.classList.add("scale-100", "opacity-100");
                }, 10);
            } else {
                panel.classList.remove("scale-100", "opacity-100");
                panel.classList.add("scale-95", "opacity-0");
                setTimeout(() => {
                    panel.classList.add("hidden");
                }, 300);
            }
        }

        toggleBtn.addEventListener("click", (e) => {
            if (dragged) {
                dragged = false;
                return;
            }
            toggleChat();
        });
        
        closeBtn.addEventListener("click", toggleChat);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse(text);
            }
            return escapeHTML(text).replace(/\n/g, '<br>');
        }

        function addMessage(text, isUser = false) {
            const wrapper = document.createElement("div");
            wrapper.className = "flex items-end gap-2.5 " + (isUser ? "justify-end" : "");

            let innerHTML = '';
            if (isUser) {
                innerHTML = `
                    <div class="bg-royal text-white rounded-2xl rounded-br-none px-4 py-3 text-[14px] shadow-sm max-w-[85%] whitespace-pre-wrap">${escapeHTML(text)}</div>
                `;
            } else {
                innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-royal to-blue-500 flex-shrink-0 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-robot text-xs"></i>
                    </div>
                    <div class="bg-white border border-gray-100 rounded-2xl rounded-bl-none px-4 py-3 text-[14px] text-gray-700 shadow-sm max-w-[85%] ai-message-content"></div>
                `;
            }
            
            wrapper.innerHTML = innerHTML;
            messagesContainer.appendChild(wrapper);
            scrollToBottom();

            if (!isUser) {
                return wrapper.querySelector('.ai-message-content');
            }
            return null;
        }
        
        function showThinking() {
            const wrapper = document.createElement("div");
            wrapper.id = "ai-thinking-bubble";
            wrapper.className = "flex items-end gap-2.5";
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-300 to-gray-400 flex-shrink-0 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-robot text-xs"></i>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl rounded-bl-none px-4 py-3 text-[14px] text-gray-500 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-spinner fa-spin text-royal"></i> AI is thinking...
                </div>
            `;
            messagesContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function removeThinking() {
            const bubble = document.getElementById("ai-thinking-bubble");
            if (bubble) bubble.remove();
        }

        function typeMessage(element, message) {
            isTyping = true;
            skipBtnContainer.classList.remove("hidden");
            currentFullMessage = message;
            currentMessageElement = element;
            element.innerHTML = "";
            let index = 0;
            
            // Fast typing effect
            currentTypingInterval = setInterval(() => {
                if (index < message.length) {
                    let char = message.charAt(index);
                    if (char === '\n') {
                        element.innerHTML += '<br>';
                    } else {
                        element.appendChild(document.createTextNode(char));
                    }
                    
                    scrollToBottom();
                    index++;
                } else {
                    finishTyping();
                }
            }, 15); // ms per char (faster)
        }

        function finishTyping() {
            if (!isTyping) return;
            
            if (currentTypingInterval) {
                clearInterval(currentTypingInterval);
            }
            if (currentMessageElement) {
                currentMessageElement.innerHTML = renderMarkdown(currentFullMessage);
            }
            isTyping = false;
            skipBtnContainer.classList.add("hidden");
            
            setTimeout(scrollToBottom, 50); // slight delay to allow dom to render markdown
        }

        skipBtn.addEventListener("click", finishTyping);

        async function sendMessage(message) {
            if (!message.trim() || isTyping) return;

            addMessage(message, true);
            inputField.value = "";
            
            showThinking();
            
            try {
                const response = await fetch("/api/frontend/chatbot/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                removeThinking();
                
                if (response.ok && data.response) {
                    const msgEl = addMessage("", false);
                    typeMessage(msgEl, data.response);
                } else {
                    const msgEl = addMessage("", false);
                    typeMessage(msgEl, data.response || "Sorry, I couldn't process your request at the moment.");
                }

            } catch (error) {
                console.error("Chatbot Error:", error);
                removeThinking();
                const msgEl = addMessage("", false);
                typeMessage(msgEl, "Sorry, there was a network error while trying to reach the server.");
            }
        }

        sendBtn.addEventListener("click", () => sendMessage(inputField.value));
        inputField.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage(inputField.value);
            }
        });

        quickQuestions.forEach(btn => {
            btn.addEventListener("click", function() {
                sendMessage(this.innerText);
                if (!isPanelOpen) {
                    toggleChat();
                }
            });
        });
    });
</script>
