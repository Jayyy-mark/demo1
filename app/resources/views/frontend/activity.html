{% extends "frontend/layouts/base.html" %}

{% block title %}News & Activities - UCSTGO{% endblock %}

{% block content %}



<!-- 2. Modern Activities Section (Cards with Glassmorphism Overlay) -->
<section id="campus-activities" class="scroll-animate py-12">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="text-center mb-10">
            <h2 class="text-2xl md:text-4xl font-bold text-blue-800 mb-4">News & Activities</h2>
            <div class="w-24 h-1 bg-amber-400 mx-auto mb-6 rounded"></div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 text-sm bg-white shadow-sm hover:shadow-lg hover:shadow-blue-500/30 border-2 border-gray-200 hover:border-blue-500 rounded-[2rem] p-10">
            <div class="relative w-full md:w-80">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="activitySearch" placeholder="Type to search..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors">
            </div>
            
            <div class="w-full md:w-auto flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-gray-500 font-medium">Year</span>
                    <select id="activityYearFilter" class="border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer bg-white">
                        <option value="all">All Years</option>
                        </select>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-8" id="activity-data-section-body">
            </div>

        <div class="flex flex-col md:flex-row justify-between items-center border-t border-gray-100 pt-6 gap-4 text-sm text-gray-600">
            <div id="pageInfo" class="font-medium text-gray-500">Page 1 of 1</div>
            
            <div class="flex items-center gap-1" id="paginationControls">
                </div>
            
            <div class="flex items-center gap-2">
                <select id="itemsPerPage" class="border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer bg-white">
                    <option value="6">6 / page</option>
                    <option value="9" selected>9 / page</option>
                    <option value="12">12 / page</option>
                    <option value="24">24 / page</option>
                </select>
            </div>
        </div>

    </div>
</section>

<!-- Dynamic Image Modal (Matches news_detail design) -->
<div id="activityModal" class="fixed inset-0 z-[100] hidden bg-black/95 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeActivityModal()">
    <button class="absolute top-8 right-8 text-white hover:text-apple-blue transition-colors focus:outline-none">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
    <img id="activityModalImage" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain animate-scale-up">
</div>

{% endblock %}

{% block scripts %}
<script>
// ၁။ Campus Vibes အတွက် Gallery Popup Function (news_detail ပုံစံအတိုင်း)
function openActivityGallery(element) {
    const imgSrc = element.getAttribute('data-gallery-src');
    const modal = document.getElementById('activityModal');
    const modalImg = document.getElementById('activityModalImage');

    if (imgSrc) {
        modalImg.src = imgSrc;
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden'; // Base page scroll ပိတ်ရန်
    }
}

function closeActivityModal() {
    const modal = document.getElementById('activityModal');
    modal.classList.add('hidden');
    document.body.style.overflow = 'auto'; // Base page scroll ပြန်ဖွင့်ရန်
}

// ၂။ News & Activities "View More" Logic များ
document.addEventListener('DOMContentLoaded', function() {

    // News Section View More
    const newsBtn = document.getElementById('load-more-news');
    const newsItems = document.querySelectorAll('.news-item');

    if (newsItems.length <= 3 && newsBtn) {
        newsBtn.style.display = 'none';
    }

    if (newsBtn) {
        newsBtn.addEventListener('click', function() {
            let hidden = Array.from(newsItems).filter(item => item.classList.contains('hidden'));

            // တစ်ခါနှိပ်လျှင် ၂ ခုစီ ဖော်ပြမည်
            hidden.slice(0, 2).forEach(item => {
                item.classList.remove('hidden');
                item.classList.add('animate-slide-up');
            });

            // ကျန်တာမရှိတော့လျှင် ခလုတ်ဖျောက်မည်
            if (Array.from(newsItems).filter(item => item.classList.contains('hidden')).length === 0) {
                newsBtn.style.display = 'none';
            }
        });
    }

    // Activities Section View More
    const actBtn = document.getElementById('load-more-activities');
    const actItems = document.querySelectorAll('.activity-item');

    if (actItems.length <= 3 && actBtn) {
        actBtn.style.display = 'none';
    }

    if (actBtn) {
        actBtn.addEventListener('click', function() {
            let hidden = Array.from(actItems).filter(item => item.classList.contains('hidden'));

            // တစ်ခါနှိပ်လျှင် ၃ ခုစီ ဖော်ပြမည်
            hidden.slice(0, 3).forEach(item => {
                item.classList.remove('hidden');
                item.classList.add('animate-slide-up');
            });

            if (Array.from(actItems).filter(item => item.classList.contains('hidden')).length === 0) {
                actBtn.style.display = 'none';
            }
        });
    }
});



</script>

<script type="module" src="{{ url_for('static', filename='frontend/js/pages/activity.js') }}"></script>
{% endblock %}

{% block styles %}
<style>
/* CSS Animations */
@keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes scaleUp {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.animate-slide-up {
    animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.animate-scale-up {
    animation: scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Line Clamp Utilities */
.line-clamp-2 {
    display: -webkit-box;
    line-clamp: 2;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.line-clamp-3 {
    display: -webkit-box;
    line-clamp: 3;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
</style>
{% endblock %}
