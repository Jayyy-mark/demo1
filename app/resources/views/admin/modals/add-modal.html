<!-- Add New User Modal -->
<div class="modal fade" id="add-modal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content border-0 rounded-4 shadow overflow-hidden">

            <!-- Header -->
            <div class="modal-header bg-primary border-0 py-3 px-4">

                <div>
                    <h4 class="modal-title text-white fw-bold mb-1">
                        Add New User
                    </h4>

                    <p class="text-white-50 small mb-0">
                        Create a new account and assign permissions
                    </p>
                </div>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <!-- Body -->
            <div class="modal-body p-4 bg-light">

                <form id="dataForm">

                    <div class="row g-4">

                        <!-- LEFT SIDE -->
                        <div class="col-lg-4">

                            <div class=" rounded-4 p-4 h-100 ">

                                <!-- Avatar -->
                                <div class="text-center">

                                    <div class="position-relative d-inline-block mb-3">

                                        <img
                                            id="currentAvatar"
                                            src="{{ url_for('static', filename='admin/images/avatar/3d-avatar-1.avif') }}"
                                            class="rounded-circle border border-4 border-white shadow"
                                            width="130"
                                            height="130"
                                            alt="avatar"
                                            style="object-fit: cover;"
                                        >

                                        <span
                                            class="position-absolute bottom-0 end-0 bg-success rounded-circle border border-3 border-white"
                                            style="width:18px;height:18px;"
                                        ></span>

                                    </div>

                                    <h6 class= mb-1">
                                        Profile Avatar
                                    </h6>

                                    <p class="text-muted small mb-4">
                                        Choose a profile image for the user
                                    </p>

                                    <!-- Choose Avatar -->
                                    <button
                                        type="button"
                                        class="btn btn-primary rounded-pill px-4 choose_avatar_btn"
                                        data-bs-toggle="modal"
                                        data-bs-target="#avatarModal"
                                    >
                                        <i class="ti ti-camera me-1"></i>
                                        Choose Avatar
                                    </button>
                                    <input type="hidden" name="user_avatar" id="user_avatar">
                                </div>

                            </div>

                        </div>

                        <!-- RIGHT SIDE -->
                        <div class="col-lg-8">

                            <div class=" rounded-4 p-4">

                                <div class="row g-3">

                                    <!-- Name -->
                                    <div class="col-md-12">

                                        <label class="form-label">
                                            Full Name
                                        </label>

                                        <input
                                            type="text"
                                            name="user_name"
                                            id="user_name"
                                            class="form-control rounded-3"
                                            placeholder="John Doe"
                                        >

                                    </div>

                                    <!-- Email -->
                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Email Address
                                        </label>

                                        <input
                                            type="email"
                                            name="user_email"
                                            id="user_email"
                                            class="form-control rounded-3"
                                            placeholder="john@example.com"
                                        >

                                    </div>

                                    <!-- Password -->
                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Password
                                        </label>

                                        <input
                                            type="password"
                                            name="user_password"
                                            id="user_password"
                                            class="form-control rounded-3"
                                            placeholder="••••••••"
                                        >

                                    </div>
                                </div>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

            <!-- Footer -->
            <div class="modal-footer border-0 bg-white px-4 py-3">

                <button
                    type="button"
                    class="btn btn-light rounded-pill px-4"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    id="btn_save"
                    class="btn btn-primary rounded-pill px-4"
                >
                    <i class="ti ti-device-floppy me-1"></i>
                    Save User
                </button>

            </div>

        </div>

    </div>

</div>
