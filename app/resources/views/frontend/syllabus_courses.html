{% extends "frontend/layouts/base.html" %}

{% block title %}Syllabus & Courses - UCSTGO{% endblock %}

{% block styles %}
<!-- Google Fonts: Plus Jakarta Sans for clean, modern geometry -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    /* Premium font pairing targeting modern sans-serif & optimal Myanmar font rendering */
    body, h1, h2, h3, h4, h5, h6, p, span, li, button, a {
        font-family: 'Plus Jakarta Sans', 'Pyidaungsu', 'Noto Sans Myanmar', 'Myanmar3', sans-serif !important;
    }

    /* Standardized Smooth Accordion Transitions Like Google Search FAQ */
    .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        opacity: 0;
    }
    .accordion-content.open {
        max-height: 1200px;
        opacity: 1;
    }

    .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}

<!-- Hero Section (Minimal Google Style) -->
<section class="py-12 pb-12 bg-blue-50">
    <div class="max-w-4xl mx-auto px-6 text-center">
        <h1 class="text-2xl md:text-4xl font-extrabold text-blue-800 mb-4 tracking-tight">
            Syllabus & Courses
        </h1>
        <div class="w-24 h-1 bg-amber-400 mx-auto mb-6 rounded"></div>


    </div>
</section>

<!-- Main Course Syllabus Section -->
<section id="syllabus-content" class="pb-28 bg-blue-50">
    <div class="max-w-4xl mx-auto px-6 bg-white shadow-xl rounded-2xl">

        <!-- Section 1: Courses by Faculties -->
        <div id="tab-faculties" class="block animate-fade-in border-t border-gray-200 hidden">

        </div>

        <!-- Section 2: Courses by Semester (Combined Single Accordion Structure) -->
        <div id="tab-semester" class=" animate-fade-in border-t border-gray-200">

        </div>

    </div>
</section>

{% endblock %}

{% block scripts %}
<script>

    function switchTab(tabName) {
    const btnFaculties = document.getElementById('btn-faculties');
    const btnSemester = document.getElementById('btn-semester');

    // Active ဖြစ်မည့် Class များ
    const activeClasses = ['bg-blue-600', 'text-white', 'shadow-[0_2px_10px_rgba(37,99,235,0.25)]', 'font-bold'];
    // Inactive ဖြစ်မည့် Class များ
    const inactiveClasses = ['text-gray-500', 'hover:text-blue-600', 'hover:bg-blue-50/50', 'font-semibold'];

    if (tabName === 'faculties') {
        // Faculties ကို Active လုပ်မည်
        btnFaculties.classList.add(...activeClasses);
        btnFaculties.classList.remove(...inactiveClasses);

        // Semester ကို Inactive လုပ်မည်
        btnSemester.classList.remove(...activeClasses);
        btnSemester.classList.add(...inactiveClasses);


        $("#tab-semester").toggleClass("hidden"); 
        $("#tab-faculties").toggleClass("hidden"); 

    } else if (tabName === 'semester') {
        // Semester ကို Active လုပ်မည်
        btnSemester.classList.add(...activeClasses);
        btnSemester.classList.remove(...inactiveClasses);

        // Faculties ကို Inactive လုပ်မည်
        btnFaculties.classList.remove(...activeClasses);
        btnFaculties.classList.add(...inactiveClasses);

        $("#tab-faculties").toggleClass("hidden");
        $("#tab-semester").toggleClass("hidden");
    }
}

    // Dynamic Accordion Toggle
    function toggleAccordion(id) {
        const content = document.getElementById(id);
        const icon = document.getElementById(id + '-icon');

        if (content.classList.contains('open')) {
            content.classList.remove('open');
            if(icon) icon.classList.remove('rotate-180');
        } else {
            content.classList.add('open');
            if(icon) icon.classList.add('rotate-180');
        }
    }
    
</script>
<script type="module" src="{{ url_for('static', filename='frontend/js/pages/syllabus_courses.js') }}"></script>
{% endblock %}
