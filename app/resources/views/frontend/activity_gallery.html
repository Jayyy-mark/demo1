{% extends "frontend/layouts/base.html" %}

{% block title %} Activity Gallery{% endblock %}

{% block content %}

<!-- Header -->
<section class="bg-white py-12 pb-12 border-b border-gray-100">

    <input type="hidden" name="" id="activity_id" value="{{ activity_id }}">

    <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <a href="" id="btn_backToActivities" class="inline-flex items-center text-sm text-gray-500 hover:text-apple-blue mb-6 transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Activities
        </a>
        <h1 class="text-2xl md:text-4xl text-center font-bold text-apple-dark mb-4" id="activity_name"></h1>
        <div class="flex items-center gap-4 text-gray-500 text-sm">
            <span class="flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg><span id="activity_date"></span></span>
            <span class="flex items-center" id="activity_category">Campus Grounds</span>
        </div>
    </div>
</section>

<!-- Description & Gallery -->
<section class="py-5 bg-apple-gray">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">

        <!-- Description -->
        <div class="max-w-3xl mx-auto mb-20 text-center">
            <p class="text-xl text-gray-600 leading-relaxed" id="description"></p>
        </div>

        <!-- Image Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="image-container">

        </div>

    </div>
</section>

<section class="py-8 border-t border-slate-100 bg-slate-50/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-row justify-between items-center gap-2 w-full">

            <!-- Previous Button -->
            <a href="#" class="group flex items-center gap-2 sm:gap-4 p-2 rounded-xl hover:bg-slate-200/50 transition-all duration-300 max-w-[48%]">
                <div class="flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-slate-200 bg-white group-hover:border-blue-500 transition-colors shrink-0">
                    <i class="fa-solid fa-arrow-left text-sm sm:text-base text-blue-500 group-hover:text-blue-600 transition-transform group-hover:-translate-x-1"></i>
                </div>
                <div class="min-w-0">
                    <span class="text-xs sm:text-sm font-black text-slate-400 uppercase tracking-widest block mb-0.5">Previous</span>
                    <h5 class="text-base sm:text-xl font-bold text-slate-700 group-hover:text-blue-600 transition-colors truncate">Tech Fest Winner List</h5>
                </div>
            </a>

            <!-- Next Button -->
            <a href="#" class="group flex items-center justify-end gap-2 sm:gap-4 p-2 rounded-xl hover:bg-slate-200/50 transition-all duration-300 max-w-[48%] text-right">
                <div class="min-w-0">
                    <span class="text-xs sm:text-sm font-black text-slate-400 uppercase tracking-widest block mb-0.5">Next</span>
                    <h5 class="text-base sm:text-xl font-bold text-slate-700 group-hover:text-blue-600 transition-colors truncate">New Semester Notice</h5>
                </div>
                <div class="flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-slate-200 bg-white group-hover:border-blue-500 transition-colors shrink-0">
                    <i class="fa-solid fa-arrow-right text-sm sm:text-base text-blue-500 group-hover:text-blue-600 transition-transform group-hover:translate-x-1"></i>
                </div>
            </a>

        </div>
    </div>
</section>

```


{% endblock %}
