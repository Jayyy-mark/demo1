<!-- ══════════════════════════════════════════════
     Chatbot Floating Button + Greeting Bubble
     ══════════════════════════════════════════════ -->

<!-- Greeting Bubble (slides out from the icon on page load) -->
<div id="chatbot-greeting" class="fixed bottom-[26px] right-[88px] z-[9998] pointer-events-none opacity-0"
    style="transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1); transform: translateX(20px) scale(0.85);">
    <div class="bg-white text-gray-800 text-[13px] font-medium pl-4 pr-5 py-2.5 rounded-2xl rounded-br-sm shadow-lg border border-gray-100 flex items-center gap-2 whitespace-nowrap pointer-events-auto cursor-pointer"
        id="chatbot-greeting-inner">
        <span id="greeting-emoji" class="text-base">👋</span>
        <span id="greeting-text">Hi! I'm your <strong class="text-blue-600">AI Assistant</strong> — ask me
            anything!</span>
    </div>
    <!-- small triangle pointing right toward the icon -->
    <div
        class="absolute top-1/2 -right-[6px] -translate-y-1/2 w-3 h-3 bg-white border-r border-b border-gray-100 rotate-[-45deg]">
    </div>
</div>

<!-- Chatbot Toggle Button (AI themed) -->
<button id="chatbot-toggle-btn"
    class="fixed bottom-6 right-6 z-[9999] w-14 h-14 rounded-full shadow-[0_6px_24px_rgba(37,99,235,0.35)] hover:shadow-[0_8px_30px_rgba(37,99,235,0.5)] hover:-translate-y-1 transition-all duration-300 flex items-center justify-center focus:outline-none cursor-move select-none overflow-hidden"
    style="background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);">
    <!-- Robot face SVG icon -->
    <svg id="chatbot-icon-robot" class="w-7 h-7 text-white transition-transform duration-300" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="3" />
        <circle cx="9" cy="16" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="15" cy="16" r="1.5" fill="currentColor" stroke="none" />
        <path d="M9 21v1M15 21v1" />
        <path d="M12 11V7" />
        <circle cx="12" cy="5" r="2" />
        <path d="M1 15h2M21 15h2" />
    </svg>
    <!-- Close X icon (shown when panel is open) -->
    <svg id="chatbot-icon-close" class="w-6 h-6 text-white absolute transition-transform duration-300 scale-0"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12" />
    </svg>

</button>


<!-- ══════════════════════════════════════════════
     Chatbot Panel
     ══════════════════════════════════════════════ -->
<div id="chatbot-panel"
    class="fixed bottom-24 right-6 z-[9999] w-[360px] md:w-[420px] bg-white rounded-3xl shadow-2xl flex flex-col hidden overflow-hidden border border-gray-200/60 transition-all duration-300 transform scale-95 opacity-0 font-sans"
    style="max-height: calc(100vh - 120px);">

    <!-- ── Header ── -->
    <div class="relative overflow-hidden px-5 py-4 flex justify-between items-center text-white"
        style="background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);">
        <!-- Decorative circles -->
        <div class="absolute -top-6 -right-6 w-24 h-24 rounded-full bg-white/[0.06]"></div>
        <div class="absolute -bottom-4 -left-4 w-16 h-16 rounded-full bg-white/[0.04]"></div>

        <div class="flex items-center gap-3 relative z-10">
            <!-- AI Avatar -->
            <div
                class="w-10 h-10 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center shadow-inner border border-white/10">
                <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="3" />
                    <circle cx="9" cy="16" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="15" cy="16" r="1.5" fill="currentColor" stroke="none" />
                    <path d="M12 11V7" />
                    <circle cx="12" cy="5" r="2" />
                </svg>
            </div>
            <div>
                <h3 class="font-bold text-base leading-tight tracking-wide">
                    UCSTGO AI Assistant
                </h3>
            </div>
        </div>

        <button id="chatbot-close-btn"
            class="relative z-10 text-white/70 hover:text-white hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center transition-all focus:outline-none">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"
                stroke-linecap="round">
                <path d="M18 6L6 18M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- ── Quick Questions ── -->
    <div id="chatbot-quick-questions"
        class="px-4 py-2.5 bg-gray-50/80 flex gap-2 overflow-x-auto whitespace-nowrap hide-scrollbar border-b border-gray-100">
        <button
            class="quick-question-btn text-[11px] font-medium bg-white border border-gray-200 text-gray-600 rounded-full px-3.5 py-1.5 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50 transition-all shadow-sm">Admission
            Requirements</button>
        <button
            class="quick-question-btn text-[11px] font-medium bg-white border border-gray-200 text-gray-600 rounded-full px-3.5 py-1.5 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50 transition-all shadow-sm">Available
            Courses</button>
        <button
            class="quick-question-btn text-[11px] font-medium bg-white border border-gray-200 text-gray-600 rounded-full px-3.5 py-1.5 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50 transition-all shadow-sm">Contact
            Info</button>
    </div>

    <!-- ── Messages Area ── -->
    <div id="chatbot-messages"
        class="flex-grow p-5 overflow-y-auto bg-gray-50 flex flex-col gap-4 h-[340px] scroll-smooth relative">
        <!-- Welcome message -->
        <div class="flex items-start gap-2.5">
            <div
                class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex-shrink-0 flex items-center justify-center text-white shadow-md">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <rect x="3" y="11" width="18" height="10" rx="3" />
                    <circle cx="9" cy="16" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="15" cy="16" r="1.5" fill="currentColor" stroke="none" />
                    <path d="M12 11V7" />
                    <circle cx="12" cy="5" r="2" />
                </svg>
            </div>
            <div
                class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 text-[13px] text-gray-700 shadow-sm leading-relaxed max-w-[85%]">
                <p class="font-medium text-gray-900 mb-1">Hello! 👋</p>
                I'm the <strong class="text-blue-600">UCSTGO AI Assistant</strong>. I can help you with admissions,
                courses, research and more. How can I help you today?
            </div>
        </div>
    </div>

    <!-- ── Skip Button ── -->
    <div class="relative">
        <div id="chatbot-skip-btn-container" class="absolute bottom-2 right-4 hidden z-10">
            <button id="chatbot-skip-btn"
                class="text-[11px] font-semibold bg-gray-800/90 backdrop-blur-sm text-white px-3.5 py-1.5 rounded-full hover:bg-gray-700 transition-colors shadow-lg flex items-center gap-1.5 focus:outline-none border border-gray-700">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path d="M5 4l10 8-10 8V4zM19 5v14" />
                </svg>
                Skip
            </button>
        </div>
    </div>

    <!-- ── Input Area ── -->
    <div class="px-4 py-3 bg-white border-t border-gray-100 flex items-center gap-2.5">
        <div class="relative flex-grow">
            <input type="text" id="chatbot-input"
                class="w-full bg-gray-100/80 border border-transparent rounded-2xl pl-4 pr-4 py-3 text-[13px] focus:outline-none focus:bg-white focus:border-blue-300 focus:ring-3 focus:ring-blue-500/10 transition-all placeholder-gray-400"
                placeholder="Type a message…">
        </div>
        <button id="chatbot-send-btn"
            class="w-10 h-10 rounded-xl text-white flex items-center justify-center flex-shrink-0 hover:opacity-90 transition-all shadow-md focus:outline-none"
            style="background: linear-gradient(135deg, #2563eb, #4f46e5);">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
        </button>
    </div>
</div>


<!-- ══════════════════════════════════════════════
     Styles
     ══════════════════════════════════════════════ -->
<style>
    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }

    .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    #chatbot-messages::-webkit-scrollbar {
        width: 5px;
    }

    #chatbot-messages::-webkit-scrollbar-track {
        background: transparent;
    }

    #chatbot-messages::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 10px;
    }

    .ai-message-content {
        line-height: 1.65;
    }

    .ai-message-content p {
        margin-bottom: 0.4rem;
    }

    .ai-message-content p:last-child {
        margin-bottom: 0;
    }

    .ai-message-content ul,
    .ai-message-content ol {
        margin-left: 1.25rem;
        margin-bottom: 0.4rem;
    }

    .ai-message-content li {
        list-style-type: disc;
        margin-bottom: 0.2rem;
    }

    .ai-message-content a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }

    .ai-message-content a:hover {
        text-decoration: underline;
    }

    .ai-message-content strong {
        font-weight: 600;
        color: #1f2937;
    }

    /* Greeting bubble animation */
    @keyframes greetSlideIn {
        0% {
            opacity: 0;
            transform: translateX(20px) scale(0.85);
        }

        100% {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }

    @keyframes greetSlideOut {
        0% {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        100% {
            opacity: 0;
            transform: translateX(20px) scale(0.85);
        }
    }

    .greeting-show {
        animation: greetSlideIn 0.5s cubic-bezier(.34, 1.56, .64, 1) forwards;
    }

    .greeting-hide {
        animation: greetSlideOut 0.35s ease forwards;
    }

    /* Pulse ring on the toggle button */
    @keyframes pulseRing {
        0% {
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
        }

        70% {
            box-shadow: 0 0 0 12px rgba(37, 99, 235, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
        }
    }

    .chatbot-pulse {
        animation: pulseRing 2.5s ease-out infinite;
    }
</style>


<!-- ══════════════════════════════════════════════
     Script
     ══════════════════════════════════════════════ -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("chatbot-toggle-btn");
        const closeBtn = document.getElementById("chatbot-close-btn");
        const panel = document.getElementById("chatbot-panel");
        const messagesContainer = document.getElementById("chatbot-messages");
        const inputField = document.getElementById("chatbot-input");
        const sendBtn = document.getElementById("chatbot-send-btn");
        const quickQuestions = document.querySelectorAll(".quick-question-btn");
        const skipBtnContainer = document.getElementById("chatbot-skip-btn-container");
        const skipBtn = document.getElementById("chatbot-skip-btn");
        const greetingBubble = document.getElementById("chatbot-greeting");
        const greetingInner = document.getElementById("chatbot-greeting-inner");
        const iconRobot = document.getElementById("chatbot-icon-robot");
        const iconClose = document.getElementById("chatbot-icon-close");

        let isPanelOpen = false;
        let isTyping = false;
        let currentTypingInterval = null;
        let currentFullMessage = "";
        let currentMessageElement = null;
        let greetingDismissed = false;
        let greetingInterval = null;
        let greetingIndex = 0;

        // 3 rotating greeting messages
        const greetingMessages = [
            { emoji: "👋", text: 'Hi! I\'m your <strong class="text-blue-600">AI Assistant</strong> — ask me anything!' },
            { emoji: "💡", text: 'Need help with <strong class="text-blue-600">admissions</strong> or <strong class="text-blue-600">courses</strong>? Ask me!' },
            { emoji: "🤖", text: 'I can answer your questions about <strong class="text-blue-600">UCSTGO</strong> instantly!' }
        ];

        const greetingEmojiEl = document.getElementById("greeting-emoji");
        const greetingTextEl = document.getElementById("greeting-text");

        // ── Marked.js for markdown rendering ──
        if (typeof marked === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
            document.head.appendChild(script);
        }

        // ═══════════════════════════════════════
        //  GREETING BUBBLE — cycles repeatedly
        // ═══════════════════════════════════════
        toggleBtn.classList.add("chatbot-pulse");

        function showGreeting() {
            if (isPanelOpen || greetingDismissed) return;

            // Update text
            const msg = greetingMessages[greetingIndex % greetingMessages.length];
            greetingEmojiEl.textContent = msg.emoji;
            greetingTextEl.innerHTML = msg.text;
            greetingIndex++;

            // Slide in
            greetingBubble.style.display = "";
            greetingBubble.classList.remove("greeting-hide");
            greetingBubble.classList.add("greeting-show");
            greetingBubble.style.pointerEvents = "auto";

            // Auto-hide after 5 seconds
            setTimeout(() => {
                hideGreeting();
            }, 5000);
        }

        function hideGreeting() {
            greetingBubble.classList.remove("greeting-show");
            greetingBubble.classList.add("greeting-hide");
            greetingBubble.style.pointerEvents = "none";
        }

        function stopGreetingCycle() {
            greetingDismissed = true;
            toggleBtn.classList.remove("chatbot-pulse");
            hideGreeting();
            if (greetingInterval) {
                clearInterval(greetingInterval);
                greetingInterval = null;
            }
            setTimeout(() => { greetingBubble.style.display = "none"; }, 400);
        }

        // First popup after 1.5s, then repeat every 12s
        setTimeout(() => {
            showGreeting();
            greetingInterval = setInterval(() => {
                showGreeting();
            }, 12000);
        }, 1500);

        // Click greeting bubble → open chat
        greetingInner.addEventListener("click", () => {
            stopGreetingCycle();
            if (!isPanelOpen) toggleChat();
        });


        // ═══════════════════════════════════════
        //  DRAGGABLE ICON
        // ═══════════════════════════════════════
        let isDragging = false;
        let startX, startY, initialX, initialY;
        let dragged = false;

        toggleBtn.addEventListener('mousedown', dragStart);
        toggleBtn.addEventListener('touchstart', dragStart, { passive: true });

        function dragStart(e) {
            if (e.type === "touchstart") {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                if (e.button !== 0) return;
                startX = e.clientX;
                startY = e.clientY;
                e.preventDefault();
            }

            const rect = toggleBtn.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;

            isDragging = true;
            dragged = false;

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);
        }

        function drag(e) {
            if (!isDragging) return;

            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

            let dx = clientX - startX;
            let dy = clientY - startY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                dragged = true;
                toggleBtn.style.transition = 'none';
                stopGreetingCycle(); // hide greeting when dragging
            }

            if (dragged) {
                if (e.type === "touchmove") e.preventDefault();

                let newX = initialX + dx;
                let newY = initialY + dy;

                const btnWidth = toggleBtn.offsetWidth;
                const btnHeight = toggleBtn.offsetHeight;

                newX = Math.max(0, Math.min(newX, window.innerWidth - btnWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - btnHeight));

                toggleBtn.style.right = 'auto';
                toggleBtn.style.bottom = 'auto';
                toggleBtn.style.left = newX + 'px';
                toggleBtn.style.top = newY + 'px';

                if (isPanelOpen) positionPanel();
            }
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            toggleBtn.style.transition = 'all 0.3s ease';
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchend', dragEnd);
        }


        // ═══════════════════════════════════════
        //  PANEL POSITIONING
        // ═══════════════════════════════════════
        function positionPanel() {
            const btnRect = toggleBtn.getBoundingClientRect();

            panel.style.bottom = 'auto';
            panel.style.right = 'auto';
            panel.style.top = 'auto';
            panel.style.left = 'auto';

            panel.style.display = 'flex';
            let panelW = panel.offsetWidth || (window.innerWidth >= 768 ? 420 : 360);
            const panelH = panel.offsetHeight || 500;
            panel.style.display = '';

            const margin = 16;
            let pLeft, pTop;

            if (btnRect.left + btnRect.width / 2 > window.innerWidth / 2) {
                pLeft = btnRect.right - panelW;
            } else {
                pLeft = btnRect.left;
            }

            if (btnRect.top + btnRect.height / 2 > window.innerHeight / 2) {
                pTop = btnRect.top - panelH - margin;
            } else {
                pTop = btnRect.bottom + margin;
            }

            pLeft = Math.max(margin, Math.min(pLeft, window.innerWidth - panelW - margin));
            pTop = Math.max(margin, Math.min(pTop, window.innerHeight - panelH - margin));

            panel.style.left = pLeft + 'px';
            panel.style.top = pTop + 'px';

            let originY = btnRect.top > window.innerHeight / 2 ? 'bottom' : 'top';
            let originX = btnRect.left > window.innerWidth / 2 ? 'right' : 'left';
            panel.style.transformOrigin = `${originX} ${originY}`;
        }


        // ═══════════════════════════════════════
        //  TOGGLE CHAT
        // ═══════════════════════════════════════
        function scrollToBottom() {
            messagesContainer.scrollTo({
                top: messagesContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function toggleChat() {
            isPanelOpen = !isPanelOpen;

            // Swap icon
            if (isPanelOpen) {
                iconRobot.style.transform = "scale(0) rotate(90deg)";
                iconClose.style.transform = "scale(1) rotate(0deg)";
            } else {
                iconClose.style.transform = "scale(0) rotate(-90deg)";
                iconRobot.style.transform = "scale(1) rotate(0deg)";
            }

            if (isPanelOpen) {
                stopGreetingCycle();
                positionPanel();
                panel.classList.remove("hidden");
                setTimeout(() => {
                    panel.classList.remove("scale-95", "opacity-0");
                    panel.classList.add("scale-100", "opacity-100");
                }, 10);
                setTimeout(() => inputField.focus(), 350);
            } else {
                panel.classList.remove("scale-100", "opacity-100");
                panel.classList.add("scale-95", "opacity-0");
                setTimeout(() => panel.classList.add("hidden"), 300);
            }
        }

        toggleBtn.addEventListener("click", (e) => {
            if (dragged) { dragged = false; return; }
            toggleChat();
        });
        closeBtn.addEventListener("click", toggleChat);


        // ═══════════════════════════════════════
        //  MESSAGE HELPERS
        // ═══════════════════════════════════════
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') return marked.parse(text);
            return escapeHTML(text).replace(/\n/g, '<br>');
        }

        const botAvatarHTML = `
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex-shrink-0 flex items-center justify-center text-white shadow-md">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <rect x="3" y="11" width="18" height="10" rx="3"/>
                    <circle cx="9" cy="16" r="1.5" fill="currentColor" stroke="none"/>
                    <circle cx="15" cy="16" r="1.5" fill="currentColor" stroke="none"/>
                    <path d="M12 11V7"/><circle cx="12" cy="5" r="2"/>
                </svg>
            </div>`;

        function addMessage(text, isUser = false) {
            const wrapper = document.createElement("div");
            wrapper.className = "flex items-start gap-2.5 " + (isUser ? "justify-end" : "");

            if (isUser) {
                wrapper.innerHTML = `
                    <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl rounded-br-sm px-4 py-3 text-[13px] shadow-md max-w-[85%] whitespace-pre-wrap leading-relaxed">${escapeHTML(text)}</div>`;
            } else {
                wrapper.innerHTML = `
                    ${botAvatarHTML}
                    <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 text-[13px] text-gray-700 shadow-sm max-w-[85%] ai-message-content leading-relaxed"></div>`;
            }

            messagesContainer.appendChild(wrapper);
            scrollToBottom();

            if (!isUser) return wrapper.querySelector('.ai-message-content');
            return null;
        }

        function showThinking() {
            const wrapper = document.createElement("div");
            wrapper.id = "ai-thinking-bubble";
            wrapper.className = "flex items-start gap-2.5";
            wrapper.innerHTML = `
                ${botAvatarHTML}
                <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 text-[13px] text-gray-400 shadow-sm flex items-center gap-2">
                    <span class="flex gap-1">
                        <span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay:0ms"></span>
                        <span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
                        <span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay:300ms"></span>
                    </span>
                    <span class="text-gray-400 text-[12px]">AI is thinking…</span>
                </div>`;
            messagesContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function removeThinking() {
            const bubble = document.getElementById("ai-thinking-bubble");
            if (bubble) bubble.remove();
        }

        function typeMessage(element, message) {
            isTyping = true;
            skipBtnContainer.classList.remove("hidden");
            currentFullMessage = message;
            currentMessageElement = element;
            element.innerHTML = "";
            let index = 0;

            currentTypingInterval = setInterval(() => {
                if (index < message.length) {
                    let char = message.charAt(index);
                    if (char === '\n') {
                        element.innerHTML += '<br>';
                    } else {
                        element.appendChild(document.createTextNode(char));
                    }
                    scrollToBottom();
                    index++;
                } else {
                    finishTyping();
                }
            }, 15);
        }

        function finishTyping() {
            if (!isTyping) return;
            if (currentTypingInterval) clearInterval(currentTypingInterval);
            if (currentMessageElement) currentMessageElement.innerHTML = renderMarkdown(currentFullMessage);
            isTyping = false;
            skipBtnContainer.classList.add("hidden");
            setTimeout(scrollToBottom, 50);
        }

        skipBtn.addEventListener("click", finishTyping);


        // ═══════════════════════════════════════
        //  SEND MESSAGE
        // ═══════════════════════════════════════
        async function sendMessage(message) {
            if (!message.trim() || isTyping) return;

            addMessage(message, true);
            inputField.value = "";

            showThinking();

            try {
                const response = await fetch("/api/frontend/chatbot/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                removeThinking();

                if (response.ok && data.response) {
                    const msgEl = addMessage("", false);
                    typeMessage(msgEl, data.response);
                } else {
                    const msgEl = addMessage("", false);
                    typeMessage(msgEl, data.response || "Sorry, I couldn't process your request at the moment.");
                }

            } catch (error) {
                console.error("Chatbot Error:", error);
                removeThinking();
                const msgEl = addMessage("", false);
                typeMessage(msgEl, "Sorry, there was a network error while trying to reach the server.");
            }
        }

        sendBtn.addEventListener("click", () => sendMessage(inputField.value));
        inputField.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage(inputField.value);
        });

        quickQuestions.forEach(btn => {
            btn.addEventListener("click", function () {
                sendMessage(this.innerText);
                if (!isPanelOpen) toggleChat();
            });
        });
    });
</script>
