{% extends 'admin/layouts/base.html' %}

{% block style %}
<style>
    .calendar-shell {
        border: 1px solid #e6eaf0;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
    }

    .calendar-toolbar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 24px;
        border-bottom: 1px solid #e6eaf0;
    }

    .calendar-nav {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .calendar-nav .btn-icon {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #dfe5ef;
        background: #fff;
        border-radius: 8px;
    }

    .calendar-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        color: #101828;
    }

    .calendar-view-switch {
        display: inline-flex;
        padding: 4px;
        gap: 4px;
        background: #f2f4f7;
        border-radius: 8px;
    }

    .calendar-view-switch button {
        min-width: 74px;
        padding: 8px 12px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #667085;
        font-weight: 600;
    }

    .calendar-view-switch button.active {
        background: #fff;
        color: #101828;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    }

    .calendar-weekdays,
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(120px, 1fr));
    }

    .calendar-grid {
        grid-template-rows: repeat(6, minmax(150px, auto));
        position: relative;
    }

    .calendar-weekday {
        padding: 16px 20px;
        color: #98a2b3;
        font-weight: 700;
        font-size: 13px;
        border-bottom: 1px solid #e6eaf0;
        background: #fafbfc;
    }

    .calendar-day {
        min-height: 150px;
        padding: 16px 12px;
        border-right: 1px solid #e6eaf0;
        border-bottom: 1px solid #e6eaf0;
        background: #fff;
        position: relative;
    }

    .calendar-day:nth-child(7n) {
        border-right: 0;
    }

    .calendar-day.is-muted {
        background: #fbfcfe;
    }

    .calendar-day.is-today {
        background: #f1f4f9;
    }

    .calendar-day-number {
        display: block;
        margin-bottom: 12px;
        color: #101828;
        font-weight: 600;
    }

    .calendar-day.is-muted .calendar-day-number {
        color: #98a2b3;
    }

    .calendar-event {
        width: auto;
        min-width: 0;
        margin: calc(48px + (var(--event-slot, 0) * 42px)) 6px 0;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        text-align: left;
        color: #101828;
        font-size: 13px;
        line-height: 1.25;
        display: flex;
        gap: 10px;
        align-items: center;
        align-self: start;
        position: relative;
        z-index: 2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .calendar-event::before {
        content: "";
        width: 4px;
        min-width: 4px;
        height: 20px;
        border-radius: 999px;
        background: currentColor;
    }

    .calendar-event.status-pending {
        background: #fff1f0;
        color: #c2410c;
    }

    .calendar-event.status-on-progress {
        background: #edf3ff;
        color: #3158ff;
    }

    .calendar-event.status-completed {
        background: #eafaf1;
        color: #12b76a;
    }

    .calendar-empty {
        padding: 48px 16px;
        text-align: center;
        color: #667085;
    }

    @media (max-width: 991.98px) {
        .calendar-toolbar {
            grid-template-columns: 1fr;
        }

        .calendar-title {
            text-align: left;
        }

        .calendar-weekdays,
        .calendar-grid {
            grid-template-columns: repeat(7, minmax(96px, 1fr));
            overflow-x: auto;
        }

        .calendar-shell {
            overflow-x: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="pc-content">
    <div class="page-header">
        <div class="page-block">
            <div class="row align-items-center">
                <div class="col">
                    <div class="page-header-title">
                        <h5 class="m-b-10">{{ page }}</h5>
                    </div>
                </div>
                <div class="col-auto">
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{{ url_for('admin.index') }}">Home</a></li>
                        <li class="breadcrumb-item" aria-current="page">{{ page }}</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- [ Main Content ] start -->
    <div class="row">
        <!-- [ sampleactivity ] start -->
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h5 class="mb-0">Academic Calendar </h5>
                    <div class="flex gap-2 float-right">
                        <a class="" href="#" role="button" id="btn_refresh">
                            <i class="ti ti-x"></i>
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <div class="calendar-shell">
                        <div class="calendar-toolbar">
                            <div class="calendar-nav">
                                <button type="button" class="btn-icon" id="calendar-prev" aria-label="Previous month">
                                    <i class="ti ti-chevron-left"></i>
                                </button>
                                <button type="button" class="btn-icon" id="calendar-next" aria-label="Next month">
                                    <i class="ti ti-chevron-right"></i>
                                </button>
                                <button type="button" class="btn btn-primary" id="calendar-add-btn">
                                    <i class="ti ti-plus"></i> Add Event
                                </button>
                            </div>

                            <h5 class="calendar-title" id="calendar-title">Calendar</h5>

                            <div class="calendar-view-switch" aria-label="Calendar view">
                                <button type="button" class="active">month</button>
                                <button type="button" disabled>week</button>
                                <button type="button" disabled>day</button>
                            </div>
                        </div>

                        <div class="calendar-weekdays">
                            <div class="calendar-weekday">SUN</div>
                            <div class="calendar-weekday">MON</div>
                            <div class="calendar-weekday">TUE</div>
                            <div class="calendar-weekday">WED</div>
                            <div class="calendar-weekday">THU</div>
                            <div class="calendar-weekday">FRI</div>
                            <div class="calendar-weekday">SAT</div>
                        </div>
                        <div class="calendar-grid" id="calendar-grid"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- [ sampleactivity ] end -->
    </div>
    <!-- [ Main Content ] end -->


</div>

<div class="modal fade" id="calendarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header pb-12 bg-primary border-bottom border-info border-0">
                <h5 class="modal-title text-white" id="calendar-modal-title">Add Calendar Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body pt-2">
                <form id="calendarForm">
                    <input type="hidden" name="id" id="calendar-id">
                    <div class="row g-3">
                        <div class="mb-2">
                            <label for="calendar-title-input" class="form-label">Title</label>
                            <input type="text" name="title" id="calendar-title-input" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label for="calendar-description" class="form-label">Description</label>
                            <textarea name="description" id="calendar-description" class="form-control"
                                rows="3"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="calendar-start-date" class="form-label">Start Date</label>
                            <input type="date" name="start_date" id="calendar-start-date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="calendar-end-date" class="form-label">End Date</label>
                            <input type="date" name="end_date" id="calendar-end-date" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label for="calendar-status" class="form-label">Status</label>
                            <select name="status" id="calendar-status" class="form-select" required>
                                <option value="Pending">Pending</option>
                                <option value="On Progress">On Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer border-0 pt-0 justify-content-between">
                <button type="button" class="btn btn-danger d-none" id="calendar-delete-btn">
                    <i class="ti ti-trash"></i> Delete
                </button>
                <div class="ms-auto">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="calendar-save-btn">
                        <i class="ti ti-device-floppy"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'admin/modals/toast.html' %}
{% endblock %}

{% block script %}
<script type="module" src="{{ assets.admin.calendar.script }}" defer></script>
{% endblock %}
