{% extends "frontend/layouts/base.html" %}

{% block title %} Lab Details{% endblock %}

{% block content %}

<input type="hidden" name="" id="laboratory_id" value="{{ laboratory_id }}">

<section class="pt-32 pb-20 bg-white">
    <div class="max-w-7xl mx-auto px-6">

        <!-- Breadcrumb & Title Area -->
        <div class="max-w-5xl mx-auto mb-12">
            <nav class="flex text-sm font-medium text-slate-400 mb-6">
                <a href="{{ url_for('frontend.research') }}" class="hover:text-blue-600 transition">Research</a>
                <span class="mx-2">/</span>
                <span class="text-slate-900 capitalize"></span>
            </nav>
            <h1 class="text-4xl md:text-6xl font-black text-slate-900 mb-4 capitalize"></h1>
            <p class="text-xl text-slate-500">Exploring the future of technology through innovation and collaboration.</p>
        </div>

        <!-- Main Lab Info -->


        <!-- IMAGE GALLERY SECTION (ပုံအများကြီးပြမည့်နေရာ) -->
        <div class="mt-20">
            <div class="flex items-end justify-between mb-10">
                <div>
                    <h2 class="text-3xl font-bold text-slate-900" id="laboratory_name"></h2>
                   
                </div>
                <div class="hidden md:block h-px flex-grow mx-10 bg-slate-100"></div>
            </div>

            <!-- Masonry-like Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="image_container">

                <!-- More images can be added here -->
            </div>
        </div>

    </div>
</section>

<!-- Image Modal (For full-screen view) -->
<div id="imageModal" class="fixed inset-0 z-[100] hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
    <button onclick="closeModal()" class="absolute top-8 right-8 text-white text-4xl">&times;</button>
    <img id="modalImg" src="" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl">
</div>

{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='frontend/js/pages/lab_details.js') }}"></script>
{% endblock %}
